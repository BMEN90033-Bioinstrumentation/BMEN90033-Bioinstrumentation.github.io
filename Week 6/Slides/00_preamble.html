<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 02: Preamble</title>
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="slide.css">
  <script src="../../theme.js"></script>
  <style>
    /* Pin the slide to exactly the viewport, with no overflow */
    html, body.slide {
      height: 100vh;
      overflow: hidden;
    }

    /* The stage fills the vertical space left after the header;
       aspect-ratio is unset so that height is flex-driven */
    .manim-stage {
      flex: 1;
      min-height: 0;       /* required for flex children to shrink */
      aspect-ratio: unset;
      max-height: none;
      background: var(--black);    /* video letterbox bars */
    }

    /* Video fills the stage completely */
    .manim-stage video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
  </style>
</head>

<body class="slide">
  <header class="slide-header">
    <span class="slide-num">02 / 20</span>
    <h1>Preamble: amplifier gain in <cite>This Is Spinal Tap</cite></h1>
  </header>

  <div class="manim-stage">
    <video controls aria-label="Film excerpt from This Is Spinal Tap">
      <source src="../Videos/SpinalTap.mp4" type="video/mp4">
      The video element is not supported by this browser.
    </video>
  </div>
</body>

</html>
