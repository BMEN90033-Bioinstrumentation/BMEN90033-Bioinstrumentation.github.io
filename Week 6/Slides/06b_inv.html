<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slide 09: Inverting amplifier</title>
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="slide.css">
  <script src="../../theme.js"></script>
  <style>
    /* manim-web sets an inline 1280 x 720 px size on its canvas; scale it to the stage */
    .manim-stage > canvas {
      width: 100% !important;
      height: 100% !important;
    }

    /* SVG overlay: stretches exactly to match the manim canvas */
    #trace-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.6s ease-out;
    }
    #trace-overlay .axis {
      stroke: var(--d-grey);
      stroke-width: 2;
      fill: none;
    }
    #trace-overlay .axis-label {
      font-family: var(--font-text);
      font-size: 20px;
      font-style: italic;
      fill: var(--d-ink);
    }
    #trace-overlay .axis-label .sub {
      font-size: 14px;
      font-style: italic;
    }
    /* The trace is V_OUT against V_IN, so it takes the V_OUT colour */
    #trace-overlay .trace {
      stroke: var(--d-orange);
      stroke-width: 4.5;
      stroke-linecap: round;
      fill: none;
    }

    /* Compact slider panel below the plot */
    #ctrl-panel {
      position: absolute;
      left: 60.5%;
      bottom: 4%;
      width: 30%;
      padding: 8px 12px 9px 12px;
      background: var(--white);
      border: 1px solid var(--slide-border);
      border-radius: var(--radius-container);
      font-family: var(--font-text);
      font-size: 12px;
      color: var(--slide-text);
      opacity: 0;
      transition: opacity 0.6s ease-out;
      box-sizing: border-box;
    }
    #ctrl-panel .slider-row {
      display: grid;
      grid-template-columns: 22px 1fr 62px;
      align-items: center;
      gap: 8px;
      margin: 2px 0;
    }
    #ctrl-panel .lbl {
      font-size: 13px;
      font-style: italic;
    }
    #ctrl-panel .val,
    #ctrl-panel .gain-readout {
      font-family: var(--font-mono);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
    }
    #ctrl-panel .val { text-align: right; }
    #ctrl-panel input[type=range] {
      width: 100%;
      margin: 0;
    }
    #ctrl-panel .gain-readout {
      margin-top: 5px;
      padding-top: 5px;
      border-top: 1px solid var(--slide-border);
      text-align: center;
    }
    /* ponytail: the panel has a fixed pixel size while the stage scales, so it is
       stepped down at narrow widths to stay clear of the plot */
    @media (max-width: 1250px) {
      #ctrl-panel { width: 35.3%; transform: scale(0.85); transform-origin: bottom left; }
    }
    @media (max-width: 1150px) {
      #ctrl-panel { width: 42.86%; transform: scale(0.7); }
    }
    @media (max-width: 830px) {
      #ctrl-panel { width: 60%; transform: scale(0.5); }
    }
  </style>
</head>
<body class="slide">
  <header class="slide-header">
    <span class="slide-num">09 / 20</span>
  </header>

  <div id="stage" class="manim-stage">
    <div class="stage-fallback">Loading scene</div>

    <!-- Overlay: plot axes + dynamic trace, all in one consistent coord system -->
    <svg id="trace-overlay" viewBox="0 0 1280 720" preserveAspectRatio="none">
      <!-- x-axis and y-axis -->
      <line class="axis" x1="770.5"  y1="450"   x2="1157.5" y2="450"/>
      <line class="axis" x1="964"    y1="580.5" x2="964"    y2="319.5"/>
      <!-- x-axis arrow tips -->
      <line class="axis" x1="1157.5" y1="450"   x2="1145.8" y2="440.1"/>
      <line class="axis" x1="1157.5" y1="450"   x2="1145.8" y2="459.9"/>
      <!-- y-axis arrow tips -->
      <line class="axis" x1="964"    y1="319.5" x2="954.1"  y2="331.2"/>
      <line class="axis" x1="964"    y1="319.5" x2="973.9"  y2="331.2"/>
      <!-- Axis labels -->
      <text class="axis-label" x="1178" y="446" text-anchor="start"  dominant-baseline="middle">V<tspan class="sub" dy="5">IN</tspan></text>
      <text class="axis-label" x="964"  y="302" text-anchor="middle" dominant-baseline="middle">V<tspan class="sub" dy="5">OUT</tspan></text>
      <!-- Dynamic trace line -->
      <line id="trace-line" class="trace" x1="0" y1="0" x2="0" y2="0"/>
    </svg>

    <!-- Compact slider panel (below the plot) -->
    <div id="ctrl-panel">
      <div class="slider-row">
        <span class="lbl">R<sub>1</sub></span>
        <input type="range" id="r1-slider" min="1" max="20" step="0.5" value="10">
        <span class="val" id="r1-val">10.0 kΩ</span>
      </div>
      <div class="slider-row">
        <span class="lbl">R<sub>2</sub></span>
        <input type="range" id="r2-slider" min="1" max="30" step="0.5" value="10">
        <span class="val" id="r2-val">10.0 kΩ</span>
      </div>
      <div class="gain-readout" id="gain-val"><i>A<sub>v</sub></i> = −1.00</div>
    </div>
  </div>

  <script type="module">
    import {
      Scene, Polygon, Rectangle, Line, Circle, Dot, Text, MathTex,
      Create, Write, FadeIn,
      UP, DOWN, LEFT, RIGHT
    } from 'https://esm.sh/manim-web@0.3.18';

    const FONT_URL = 'https://cdn.jsdelivr.net/npm/katex@0.16.0/dist/fonts/KaTeX_Main-Regular.ttf';
    // manim-web needs literal hex strings; read once from the theme.css data palette
    const BG    = T.plotBg;
    const FG    = T.c('ink');
    const MUTED = T.c('slate');    // bullet text
    const RAIL  = T.c('grey');     // op-amp outline
    const RES   = T.c('blue');     // R_1 and R_2
    const OUT   = T.c('orange');   // V_OUT and the transfer trace
    const NEG   = T.c('pink');     // inverting input
    const POS   = T.c('green');    // non-inverting input

    const stage = document.getElementById('stage');
    stage.querySelector('.stage-fallback')?.remove();
    const scene = new Scene(stage, { width: 1280, height: 720, backgroundColor: BG });

    // Title
    const title = new Text({ text: 'Inverting amplifier', fontSize: 40, color: FG, fontUrl: FONT_URL });
    await title.loadGlyphs?.();
    title.moveTo([-3.5, 3.5, 0]);
    const TITLE_LEFT_X = -6.2;
    if (typeof title.getLeft === 'function') {
      title.shift([TITLE_LEFT_X - title.getLeft()[0], 0, 0]);
    }

    // Layout constants (shifted down so feedback path clears the title)
    const CX = -3.3, CY = 1.0;
    const TRI_HALF_H = 0.9;
    const TRI_IN_X   = CX - 0.9;    // -4.2
    const TRI_APEX_X = CX + 0.8;    // -2.5
    const LEFT_COL_X = -4.6;
    const TAP_X      = -1.4;
    const OUT_X      = -0.2;
    const plusY      = CY - 0.35;   // 0.65: (+) input on bottom
    const minusY     = CY + 0.35;   // 1.35: (−) input on top
    const FB_Y       = 2.1;         // horizontal feedback run above triangle
    const GND_Y      = -1.4;
    const VIN_X      = -6.0;

    // Plot constants (kept for equation placement; plot is drawn in SVG)
    const PX = 3.6, PY = -1.0, PW = 2.0, PH = 1.3;

    // Op-amp triangle
    const tri = new Polygon({
      vertices: [
        [TRI_IN_X,   CY - TRI_HALF_H, 0],
        [TRI_IN_X,   CY + TRI_HALF_H, 0],
        [TRI_APEX_X, CY,              0]
      ],
      color: RAIL, strokeWidth: 1.7, fillOpacity: 0.13
    });

    // + / − terminal markers (inverting: − on top, + on bottom)
    const minusSign = new Text({ text: '−', fontSize: 18, color: NEG,   fontUrl: FONT_URL });
    const plusSign  = new Text({ text: '+', fontSize: 18, color: POS, fontUrl: FONT_URL });
    await Promise.all([minusSign.loadGlyphs?.(), plusSign.loadGlyphs?.()]);
    minusSign.moveTo([TRI_IN_X + 0.3, minusY, 0]);
    plusSign.moveTo([TRI_IN_X + 0.3, plusY,  0]);

    // Input type labels (small annotations paired with + / − signs)
    const invLbl    = new Text({ text: 'Inverting',     fontSize: 16, color: NEG,   fontUrl: FONT_URL });
    const nonInvLbl = new Text({ text: 'Non-inverting', fontSize: 16, color: POS, fontUrl: FONT_URL });
    await Promise.all([invLbl.loadGlyphs?.(), nonInvLbl.loadGlyphs?.()]);
    // Each label sits just below its input wire, right-aligned clear of the left column
    invLbl.moveTo([-5.2, 1.0, 0]);
    nonInvLbl.moveTo([-5.3, 0.4, 0]);
    for (const lbl of [invLbl, nonInvLbl]) {
      if (typeof lbl.getRight === 'function') {
        lbl.shift([LEFT_COL_X - 0.14 - lbl.getRight()[0], 0, 0]);
      }
    }

    // Output wire
    const outWire  = new Line({ start: [TRI_APEX_X, CY, 0], end: [OUT_X, CY, 0], color: FG, strokeWidth: 1.8 });
    const vOutPort = new Circle({ radius: 0.07, color: FG, strokeWidth: 2, fillColor: FG, fillOpacity: 1 }).moveTo([OUT_X, CY, 0]);
    const vOutLbl  = new MathTex({ latex: 'V_{OUT}', color: OUT });
    await vOutLbl.waitForRender?.();
    vOutLbl.scale(0.7).nextTo([OUT_X, CY, 0], RIGHT, 0.14);

    // Vin terminal
    const vInPort = new Circle({ radius: 0.07, color: FG, strokeWidth: 2, fillColor: FG, fillOpacity: 1 }).moveTo([VIN_X, minusY, 0]);
    const vInLbl  = new MathTex({ latex: 'V_{IN}', color: FG });
    await vInLbl.waitForRender?.();
    vInLbl.scale(0.7).nextTo([VIN_X, minusY, 0], LEFT, 0.14);

    // R1 on the input branch to the summing node
    const R1_W = 1.0, R1_H = 0.34;
    const R1_CX = (VIN_X + LEFT_COL_X) / 2;   // -5.3
    const inWireL = new Line({ start: [VIN_X, minusY, 0],            end: [R1_CX - R1_W / 2, minusY, 0], color: FG, strokeWidth: 1.8 });
    const inWireR = new Line({ start: [R1_CX + R1_W / 2, minusY, 0], end: [LEFT_COL_X, minusY, 0],       color: FG, strokeWidth: 1.8 });
    const inStub  = new Line({ start: [LEFT_COL_X, minusY, 0],       end: [TRI_IN_X, minusY, 0],         color: FG, strokeWidth: 1.8 });
    const R1 = new Rectangle({ width: R1_W, height: R1_H, color: RES, strokeWidth: 2, fillOpacity: 0.22 });
    R1.moveTo([R1_CX, minusY, 0]);
    const R1Lbl = new MathTex({ latex: 'R_{1}', color: RES });
    await R1Lbl.waitForRender?.();
    R1Lbl.scale(0.6).moveTo([R1_CX, minusY + R1_H / 2 + 0.18, 0]);

    const sumDot = new Dot({ point: [LEFT_COL_X, minusY, 0], color: FG, radius: 0.06 });

    // Feedback R2 (output tap to up to across above triangle to down to summing node)
    const R2_W = 1.0, R2_H = 0.34;
    const R2_CX = (TAP_X + LEFT_COL_X) / 2;   // -3.0
    const fb1  = new Line({ start: [TAP_X, CY, 0],                end: [TAP_X, FB_Y, 0],                color: FG, strokeWidth: 1.8 });
    const fb2R = new Line({ start: [TAP_X, FB_Y, 0],              end: [R2_CX + R2_W / 2, FB_Y, 0],     color: FG, strokeWidth: 1.8 });
    const fb2L = new Line({ start: [R2_CX - R2_W / 2, FB_Y, 0],   end: [LEFT_COL_X, FB_Y, 0],           color: FG, strokeWidth: 1.8 });
    const fb3  = new Line({ start: [LEFT_COL_X, FB_Y, 0],         end: [LEFT_COL_X, minusY, 0],         color: FG, strokeWidth: 1.8 });
    const R2 = new Rectangle({ width: R2_W, height: R2_H, color: RES, strokeWidth: 2, fillOpacity: 0.22 });
    R2.moveTo([R2_CX, FB_Y, 0]);
    const R2Lbl = new MathTex({ latex: 'R_{2}', color: RES });
    await R2Lbl.waitForRender?.();
    R2Lbl.scale(0.6).moveTo([R2_CX, FB_Y + R2_H / 2 + 0.18, 0]);

    const tapDot = new Dot({ point: [TAP_X, CY, 0], color: FG, radius: 0.06 });

    // + input grounded
    const plusStub = new Line({ start: [TRI_IN_X, plusY, 0],    end: [LEFT_COL_X, plusY, 0], color: FG, strokeWidth: 1.8 });
    const gndDrop  = new Line({ start: [LEFT_COL_X, plusY, 0],  end: [LEFT_COL_X, GND_Y, 0], color: FG, strokeWidth: 1.8 });
    const gnd1 = new Line({ start: [LEFT_COL_X - 0.35, GND_Y,        0], end: [LEFT_COL_X + 0.35, GND_Y,        0], color: FG, strokeWidth: 3 });
    const gnd2 = new Line({ start: [LEFT_COL_X - 0.22, GND_Y - 0.15, 0], end: [LEFT_COL_X + 0.22, GND_Y - 0.15, 0], color: FG, strokeWidth: 2 });
    const gnd3 = new Line({ start: [LEFT_COL_X - 0.10, GND_Y - 0.28, 0], end: [LEFT_COL_X + 0.10, GND_Y - 0.28, 0], color: FG, strokeWidth: 1 });

    // Equation (above the plot)
    const eqn = new MathTex({ latex: 'A_v = -\\dfrac{R_{2}}{R_{1}}', color: FG });
    await eqn.waitForRender?.();
    eqn.scale(0.8).moveTo([PX, PY + PH + 1.1, 0]);

    // Explanatory bullet points
    const NOTES_X = -6.0;
    const NOTES_Y0 = -2.0;
    const NOTES_DY = 0.55;
    const NOTE_FONT = 22;
    const NOTE_SCALE = 0.38;   // matches MathTex notes to the Text notes

    const noteDefs = [
      { latex: '\\text{The input reaches the inverting terminal through } R_1\\text{; the output is inverted}' },
      { text: 'The non-inverting input is grounded and sets the reference potential' },
      { latex: '\\text{Gain: } A_v = -\\dfrac{R_2}{R_1} \\quad \\text{(the negative sign denotes phase inversion)}' },
      { latex: '\\text{Input impedance} \\approx R_1' },
    ];
    const noteBullets = [];
    for (let i = 0; i < noteDefs.length; i++) {
      const dot = new Text({ text: '\u2022', fontSize: NOTE_FONT, color: MUTED, fontUrl: FONT_URL });
      await dot.loadGlyphs?.();

      let item;
      const def = noteDefs[i];
      if (def.latex) {
        item = new MathTex({ latex: def.latex, color: MUTED });
        await item.waitForRender?.();
        item.scale(NOTE_SCALE);
      } else {
        item = new Text({ text: def.text, fontSize: NOTE_FONT, color: MUTED, fontUrl: FONT_URL });
        await item.loadGlyphs?.();
      }

      dot.moveTo([NOTES_X, NOTES_Y0 - i * NOTES_DY, 0]);
      item.moveTo([NOTES_X + 0.4, NOTES_Y0 - i * NOTES_DY, 0]);
      if (typeof item.getLeft === 'function') {
        item.shift([NOTES_X + 0.4 - item.getLeft()[0], 0, 0]);
      }
      if (typeof dot.getLeft === 'function') {
        dot.shift([NOTES_X - dot.getLeft()[0], 0, 0]);
      }
      noteBullets.push(dot, item);
    }

    // Sequence

    // 1. Title
    await scene.play(new Write(title, { duration: 0.7 }));

    // 2. Op-amp shell: triangle, terminals, output wire/port/label
    await scene.play(
      new Create(tri),
      new Write(plusSign), new Write(minusSign),
      new Write(invLbl), new Write(nonInvLbl),
      new Create(outWire), new Create(vOutPort), new Write(vOutLbl)
    );

    // 3. Gain-setting network: Vin to R1 to summing node, feedback R2, ground
    await scene.play(
      new Create(vInPort), new Write(vInLbl),
      new Create(inWireL), new Create(inWireR), new Create(inStub),
      new Create(R1), new Write(R1Lbl),
      new Create(fb1), new Create(fb2R), new Create(fb2L), new Create(fb3),
      new Create(R2), new Write(R2Lbl),
      new Create(plusStub), new Create(gndDrop),
      new Create(gnd1), new Create(gnd2), new Create(gnd3),
      new FadeIn(tapDot), new FadeIn(sumDot)
    );

    // 4. Equation above the plot
    await scene.play(new Write(eqn));

    // 5. Reveal SVG plot + interactive slider panel
    document.getElementById('trace-overlay').style.opacity = '1';
    document.getElementById('ctrl-panel').style.opacity = '1';

    // 6. Fade in explanatory notes
    await scene.play(...noteBullets.map(b => new FadeIn(b)));
  </script>

  <script>
    // Interactive slider to SVG trace
    (function () {
      const PX = 3.6, PY = -1.0, PW = 2.0, PH = 1.3;

      // Scene to SVG viewBox (1280 × 720, origin at centre, 90 px/unit)
      const toSvg = (x, y) => [640 + x * 90, 360 - y * 90];

      const traceEl = document.getElementById('trace-line');
      const r1Slider = document.getElementById('r1-slider');
      const r2Slider = document.getElementById('r2-slider');
      const r1Val = document.getElementById('r1-val');
      const r2Val = document.getElementById('r2-val');
      const gainEl = document.getElementById('gain-val');

      function update() {
        const r1 = parseFloat(r1Slider.value);
        const r2 = parseFloat(r2Slider.value);
        const slope = -(r2 / r1);
        const mag = Math.max(Math.abs(slope), 0.01);

        const dx = Math.min(PW * 0.9, (PH * 0.9) / mag);
        const [x1, y1] = toSvg(PX - dx, PY - slope * dx);
        const [x2, y2] = toSvg(PX + dx, PY + slope * dx);
        traceEl.setAttribute('x1', x1);
        traceEl.setAttribute('y1', y1);
        traceEl.setAttribute('x2', x2);
        traceEl.setAttribute('y2', y2);

        r1Val.textContent = r1.toFixed(1) + ' kΩ';
        r2Val.textContent = r2.toFixed(1) + ' kΩ';
        gainEl.innerHTML = '<i>A<sub>v</sub></i> = ' + slope.toFixed(2).replace('-', '\u2212');
      }

      r1Slider.addEventListener('input', update);
      r2Slider.addEventListener('input', update);
      update();
    })();
  </script>
</body>
</html>
